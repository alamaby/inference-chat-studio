name : ci-windows

on :
  push :
    branches : ["main"]
  pull_request :

jobs :
  rust :
    runs-on : windows-latest
    steps :
      - uses : actions/checkout@v4
      - uses : dtolnay/rust-toolchain@stable
        with :
          toolchain : stable
      - uses : Swatinem/rust-cache@v2
      - name : Rust tests
        run : cargo test --workspace

  web :
    runs-on : windows-latest
    steps :
      - uses : actions/checkout@v4
      - uses : pnpm/action-setup@v4
        with :
          version : 10.34.5
      - uses : actions/setup-node@v4
        with :
          node-version : 22
          cache : pnpm
      - name : Install
        run : pnpm install --frozen-lockfile
      - name : Typecheck
        run : pnpm --filter inference-chat-studio-desktop typecheck
      - name : Tests
        run : pnpm --filter inference-chat-studio-desktop test
