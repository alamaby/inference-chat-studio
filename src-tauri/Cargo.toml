[package]
name = "inference-chat-studio-tauri"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# NOTE: `devtools` feature ships WebView DevTools in release builds.
# Intended for the unsigned internal MVP only; drop it before public release.
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
conversation-store = { path = "../crates/conversation-store" }
secret-store = { path = "../crates/secret-store", features = ["test-utils"] }
provider-core = { path = "../crates/provider-core" }
provider-openai = { path = "../crates/provider-openai" }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
